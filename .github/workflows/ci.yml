name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    # The sqlite-based test fixtures (tests/conftest.py) cover the DB layer,
    # but document deletion also cleans up real Qdrant points
    # (app/rag/qdrant_store.py:get_qdrant_client() always talks to a real
    # QdrantClient, never mocked — same "verify against real infra" choice
    # as the Tesseract/poppler dependencies above) — tests/test_document_
    # upload.py and tests/test_document_audit_log.py exercise that path and
    # need a real Qdrant to connect to, or they fail with connection
    # refused despite passing inside the app's own docker-compose stack
    # where Qdrant is always running alongside.
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      # tests/test_ocr.py and tests/test_pdf_extraction.py exercise real
      # Tesseract/poppler binaries (app/ingestion/ocr.py), not mocks — the
      # Dockerfile installs these via apt for the same reason; a bare
      # runner needs them too or those tests fail here despite passing
      # inside the app's own container.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Validates the multi-stage Dockerfile actually builds the bundle it
      # just typechecked/built above — a broken Dockerfile (bad COPY path,
      # stale nginx.conf reference, etc.) would otherwise only surface when
      # someone runs `docker compose up`, not in CI.
      - name: Build frontend Docker image
        working-directory: .
        run: docker build -t industrial-copilot-frontend:ci ./frontend

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      # Builds the real backend image (same Dockerfile as production) and
      # brings up backend + worker + their real Postgres/Qdrant/Redis
      # dependencies via docker-compose's own depends_on/healthcheck
      # chain — not a mocked stand-in. This is the CI equivalent of the
      # manual `docker compose up` + curl verification every phase of this
      # project was built against.
      - name: Build and start core services
        run: docker compose up -d --build backend worker

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then
              echo "backend healthy"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy in time" >&2
          docker compose logs backend
          exit 1

      - name: Smoke-check /metrics is real Prometheus output
        run: curl -sf http://localhost:8000/metrics | grep -q '^python_info'

      - name: Smoke-check register + login round trip
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci-smoke-user","email":"ci-smoke@example.com","password":"correct-horse-battery","tenant_id":"ci"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          test -n "$TOKEN"
          curl -sf http://localhost:8000/api/v1/auth/me -H "Authorization: Bearer $TOKEN" | grep -q ci-smoke-user

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
