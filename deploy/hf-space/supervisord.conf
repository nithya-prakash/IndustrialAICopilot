[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=bash -c 'exec $(ls -d /usr/lib/postgresql/*/bin | head -1)/postgres -D /home/user/pg -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp'
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=bash -c '. /home/user/runtime/env; exec redis-server --port 6379 --bind 127.0.0.1 --requirepass "$REDIS_PASSWORD" --save "" --dir /home/user/redis'
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:qdrant]
command=bash -c 'cd /home/user/qdrant-run && exec qdrant'
environment=QDRANT__STORAGE__STORAGE_PATH="/home/user/qdrant",QDRANT__SERVICE__HOST="127.0.0.1"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
command=bash -c '. /home/user/runtime/env; cd /home/user/app; until pg_isready -q -h 127.0.0.1; do sleep 1; done; alembic upgrade head && exec uvicorn app.main:app --host 127.0.0.1 --port 8000'
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=bash -c '. /home/user/runtime/env; cd /home/user/app; sleep 15; exec celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1'
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /home/user/nginx.conf -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:seed]
command=bash /home/user/seed.sh
priority=50
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
