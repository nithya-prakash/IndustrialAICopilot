[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests that require real Postgres/Qdrant (run via docker compose)",
    "e2e: end-to-end tests exercising the full diagnosis pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-default is the documented, idiomatic pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are synthetic manual prose content, not logic.
"scripts/generate_sample_manual.py" = ["E501"]
